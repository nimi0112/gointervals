name: Feature request
description: Something the timers should do
title: '[idea] '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The workout, study session or task, not the feature. "Beep at the halfway point of a 3 minute round" beats "add a midpoint beep option".
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      placeholder: Two timers side by side / a kitchen timer / I don't.
  - type: markdown
    attributes:
      value: Read AGENTS.md before proposing UI. No dark mode, no accounts, no server, no new dependencies without a reason.
